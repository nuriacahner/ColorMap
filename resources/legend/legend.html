<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; margin: 8px; color: #222; background: #fff;
         overflow-wrap: anywhere; word-break: break-word; }
  h1 { font-size: 13px; margin: 0 0 6px 0; }
  .doc { color: #777; font-size: 11px; margin-bottom: 8px; }
  .map { border-top: 1px solid #ddd; padding-top: 8px; margin-top: 8px; }
  .title { font-weight: bold; margin-bottom: 6px; }
  .scale { display: flex; align-items: stretch; height: 260px; margin: 4px 0 8px 0; }
  .bar { width: 26px; border: 1px solid #555; }
  .ticks { position: relative; width: 70px; }
  .tick { position: absolute; left: 0; transform: translateY(-50%); white-space: nowrap; font-size: 11px; }
  .tick::before { content: ''; display: inline-block; width: 6px; height: 1px; background: #333;
                  vertical-align: middle; margin-right: 4px; }
  ul { margin: 0; padding-left: 14px; }
  li { margin: 2px 0; line-height: 1.3; }
  .none { color: #777; font-style: italic; }
  .note { color: #a05a00; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<h1>Color Map – leyenda</h1>
<div class="doc" id="doc"></div>
<div id="maps"></div>

<script>
  // Fusion palette <-> ColorMap (cm_core.on_legend_message / push_legend). Data only: every text goes in
  // with textContent, colours are built from numbers - nothing from a file is run as HTML.
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }

  function rgb(c) { return 'rgb(' + (+c[0]) + ',' + (+c[1]) + ',' + (+c[2]) + ')'; }

  function scale(leg) {
    var box = el('div', 'scale');
    var bar = el('div', 'bar');
    var cols = (leg.colors || []).map(rgb);
    // bottom = lo, top = hi
    bar.style.background = 'linear-gradient(to top, ' + cols.join(', ') + ')';
    var ticks = el('div', 'ticks');
    var lo = +leg.lo, hi = +leg.hi, step = +leg.tick || 100, unit = leg.unit || '';
    if (hi > lo && step > 0) {
      for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
        var t = el('div', 'tick', v + ' ' + unit);
        t.style.top = (100 * (hi - v) / (hi - lo)) + '%';
        ticks.appendChild(t);
      }
    }
    box.appendChild(bar);
    box.appendChild(ticks);
    return box;
  }

  function render(s) {
    document.getElementById('doc').textContent = s.doc || '';
    var root = document.getElementById('maps');
    root.innerHTML = '';
    var list = s.maps || [];
    if (!list.length) {
      root.appendChild(el('div', 'none', 'Ningún mapa de color visible. Actívalo en Inspect > Color Map.'));
      return;
    }
    list.forEach(function (m) {
      var box = el('div', 'map');
      var leg = m.legend;
      box.appendChild(el('div', 'title', (leg && leg.title) ? leg.title : m.name));
      if (!leg) {
        box.appendChild(el('div', 'none', m.name + ': este mapa no tiene leyenda (no viene de la herramienta de densidad).'));
      } else {
        box.appendChild(scale(leg));
        var ul = el('ul');
        (leg.lines || []).forEach(function (line) { ul.appendChild(el('li', null, line)); });
        box.appendChild(ul);
        if (leg.from_file) {
          box.appendChild(el('div', 'note',
            'Leyenda leída del archivo junto al PLY original. Para guardarla dentro del diseño, ' +
            'vuelve a añadir este mapa en Color Map (Add PLY files) con un PLY nuevo de la herramienta.'));
        }
      }
      root.appendChild(box);
    });
  }

  window.fusionJavaScriptHandler = {
    handle: function (action, data) {
      if (action === 'update') { try { render(JSON.parse(data)); } catch (e) {} }
      return 'OK';
    }
  };

  window.addEventListener('load', function () {
    try {
      var p = adsk.fusionSendData('ready', '{}');
      if (p && p.then) { p.then(function (r) { if (r) { try { render(JSON.parse(r)); } catch (e) {} } }); }
    } catch (e) {}
  });
</script>
</body>
</html>
